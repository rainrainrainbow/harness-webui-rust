[package]
name = "harness-webui-rust"
version = "0.1.0"
edition = "2021"
description = "DeepSeek Harness style Web UI (pure UI + mock engine), single binary"

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
